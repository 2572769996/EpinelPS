name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号 (例如 v1.0.0)，留空则自动生成'
        required: false
        type: string

permissions:
  contents: write

jobs:
  # ========== 确定版本号 ==========
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # tag 推送：直接用 git tag
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            # 手动触发 + 用户填了 tag
            TAG="${{ github.event.inputs.tag }}"
            # 自动补 v 前缀
            if [[ ! "$TAG" =~ ^v ]]; then
              TAG="v${TAG}"
            fi
          else
            # 手动触发 + 没填 tag：自动生成
            TAG="v$(date +%Y%m%d-%H%M%S)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "📦 Release tag: $TAG"

  # ========== Windows 构建 ==========
  build:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: dotnet restore

      - name: Publish ServerSelector
        run: >
          dotnet publish ServerSelector.Desktop
          -c Release
          -p:DebugType=none
          -p:DebugSymbols=false

      - name: Publish EpinelPS
        run: >
          dotnet publish EpinelPS
          -c Release
          -p:DebugType=none
          -p:DebugSymbols=false

      - name: Assemble release
        run: |
          mkdir release
          copy ServerSelector.Desktop\bin\Release\net10.0\win-x64\publish\ServerSelector.Desktop.exe release\
          copy ServerSelector.Desktop\sodium.dll release\
          copy EpinelPS\bin\Release\net10.0\win-x64\publish\EpinelPS.exe release\
          copy EpinelPS\gameconfig.json release\
          copy EpinelPS\gameversion.json release\
          xcopy /s /e /i "EpinelPS\wwwroot" "release\wwwroot"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EpinelPS
          path: release/

  # ========== 发布 Release ==========
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: EpinelPS
          path: ./release/

      - name: Zip release
        run: cd release && zip -r ../EpinelPS.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "EpinelPS ${{ needs.prepare.outputs.tag }}"
          generate_release_notes: true
          files: EpinelPS.zip
          overwrite_files: true
